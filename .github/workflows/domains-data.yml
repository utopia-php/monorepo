name: Domains data

# The domains parser ships a generated copy of the public suffix list. Refresh
# it on a schedule and open a pull request when publicsuffix.org has moved on.
on:
  schedule:
    - cron: '12 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: php packages/domains/data/import.php

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet packages/domains/data/data.php; then
            echo "public suffix list unchanged"
            exit 0
          fi
          BRANCH="chore/domains-public-suffix-list"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "$BRANCH"
          git commit -m 'chore(domains): refresh the public suffix list' packages/domains/data/data.php
          git push --force origin "$BRANCH"
          gh pr view "$BRANCH" --json state --jq .state | grep -q OPEN \
            || gh pr create --base main --head "$BRANCH" \
              --title 'chore(domains): refresh the public suffix list' \
              --body 'Generated by the Domains data workflow from https://publicsuffix.org.'
