services:
  redis:
    image: redis:alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-auth:
    image: redis:alpine
    command:
      - sh
      - -c
      - |
        printf 'requirepass secretpw\nuser worker on >workerpw ~* &* +@all\n' > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "16380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secretpw", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-cluster-auth:
    # One node owning every slot: enough for a client to run the cluster
    # handshake and authenticate, without the multi-node image's fixed config.
    image: redis:alpine
    command:
      - sh
      - -c
      - |
        printf 'port 17100\ncluster-enabled yes\ncluster-announce-ip 127.0.0.1\nrequirepass secretpw\nuser worker on >workerpw ~* &* +@all\n' > /tmp/redis.conf
        redis-server /tmp/redis.conf &
        until redis-cli -p 17100 -a secretpw --no-auth-warning cluster addslotsrange 0 16383 > /dev/null 2>&1; do sleep 0.2; done
        wait
    ports:
      - "17100:17100"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 17100 -a secretpw --no-auth-warning cluster info | grep -q cluster_state:ok"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "14225:4222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-cluster:
    image: grokzen/redis-cluster:7.0.10
    environment:
      IP: "0.0.0.0"
      INITIAL_PORT: 17000
      MASTERS: 3
      SLAVES_PER_MASTER: 0
    ports:
      - "17000-17002:17000-17002"
    healthcheck:
      test: ["CMD-SHELL", "for p in 17000 17001 17002; do redis-cli -p $$p cluster info | grep -q cluster_state:ok || exit 1; done"]
      interval: 2s
      timeout: 5s
      retries: 30
