name: Documentation
description: Report a documentation issue or suggest an improvement
title: "Documentation: "
labels: [documentation]
body:
  - type: textarea
    id: issue-description
    attributes:
      label: Description
      description: Describe the documentation issue.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing issues first
          required: true
        - label: I read the Code of Conduct
          required: true
