name: Feature Request
description: Suggest a new feature or improvement
title: "Feature: "
labels: [feature]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: Describe the feature clearly.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain why this would be useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing issues first
          required: true
        - label: I read the Code of Conduct
          required: true
