name: Bug Report
description: Submit a bug report to help improve the package
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Reproduction steps
      description: Describe how to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which package version are you using?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing issues first
          required: true
        - label: I read the Code of Conduct
          required: true
